name: ci

# The hooks in .githooks/ are local and bypassable — `--no-verify` defeats them,
# and they only run for someone who has set core.hooksPath. This workflow runs
# the same checks where they cannot be skipped, which is what turns a convention
# into a gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # ubuntu runs bash 5; macos-latest ships bash 3.2 as /bin/bash, which is the
    # only place the repo's stated 3.2 compatibility is actually exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Record the shell under test
        run: |
          /bin/bash --version | head -1
          echo "locale: ${LC_ALL:-unset}"

      - name: Run the suite
        run: /bin/bash tests/run-all.sh

      - name: Validate every findings file
        run: /bin/bash process/01-scan/validate-findings.sh

      - name: Prove the suite can fail
        # A runner that swallows a failure makes every suite vacuous while
        # reporting green. Assert the failure path rather than trusting it.
        run: |
          if /bin/bash tests/run-all.sh tests/fixtures/runner/failing >/dev/null 2>&1; then
            echo "run-all.sh reported success on a deliberately failing suite" >&2
            exit 1
          fi
          echo "ok — the runner fails when a suite fails"

  commit-messages:
    # The commit-msg hook is bypassable. This is the same check, server-side,
    # across every commit the pull request would add.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check conventional subjects and refuse attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          fail=0
          # --no-merges: a merge commit's subject is generated by the forge, not
          # authored, so holding it to the convention blocks every branch that
          # has main merged into it.
          for c in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            subject="$(git log -1 --format=%s "$c")"
            if ! printf '%s' "$subject" \
              | grep -Eq '^(feat|fix|docs|refactor|test|chore)(\([a-z0-9._/-]+\))?!?: .+'; then
              echo "::error::${c:0:7} is not a conventional commit — $subject"
              fail=1
            fi
            if [ "${#subject}" -gt 72 ]; then
              echo "::error::${c:0:7} subject is ${#subject} characters, limit is 72"
              fail=1
            fi
            if git log -1 --format=%B "$c" \
              | grep -Eiq '^[[:space:]]*co-authored-by:|generated with|🤖|noreply@anthropic\.com'; then
              echo "::error::${c:0:7} carries an attribution trailer (AGENTS.md § Commits)"
              fail=1
            fi
          done
          exit "$fail"

  claims:
    # AGENTS.md forbids any claim about speed. That was a prose promise with
    # nothing behind it; this is the check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse speed and velocity claims
        run: |
          set -u
          # Matches are reported with context so a false positive is obvious and
          # the fix is to rephrase, not to weaken the pattern.
          if git grep -nEi '\b(makes? (us|it|teams?) faster|ships? faster|speeds? up delivery|velocity (gain|improvement)|cycle.time (reduction|improvement)|[0-9]+x (faster|productivity))\b' \
             -- '*.md' > /tmp/hits 2>/dev/null; then
            echo "::error::a speed or velocity claim appears in a tracked document"
            sed 's/^/  /' /tmp/hits
            echo "AGENTS.md: the north star is better software, not faster."
            exit 1
          fi
          echo "ok — no speed claims"
