name: ci

# The hooks in .githooks/ are local and bypassable — `--no-verify` defeats them,
# and they only run for someone who has set core.hooksPath. This workflow runs
# the same checks where they cannot be skipped, which is what turns a convention
# into a gate.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # ubuntu runs bash 5; macos-latest ships bash 3.2 as /bin/bash, which is the
    # only place the repo's stated 3.2 compatibility is actually exercised.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, because bin/validate-standards.sh resolves the
          # evidence pointers the documents cite and the research corpus is a
          # commit that is not on any branch. A depth-1 checkout cannot see it,
          # and the gate exits 2 rather than reporting the documents clean from a
          # clone that does not contain what they point at.
          fetch-depth: 0

      - name: Record the shell under test
        run: |
          /bin/bash --version | head -1
          echo "locale: ${LC_ALL:-unset}"

      - name: Run the suite
        run: /bin/bash tests/run-all.sh

      - name: Validate every findings file
        run: /bin/bash process/01-scan/validate-findings.sh

      - name: Validate STANDARDS.md cites its sources
        # The document the loop exists to keep true was the only artifact with no
        # gate. An external audit found 31 graded claims, zero citations, and a
        # route to evidence that was a branch which does not exist.
        run: /bin/bash bin/validate-standards.sh

      - name: Validate every discovery topic
        # Fields, the question in the asker's own words, coverage in three parts,
        # the open section, and that grades come from the enum. The macOS leg
        # matters here: the first version of this gate used `\?` in a sed address,
        # a GNU extension, which refused every artifact on BSD sed and passed on
        # this one.
        run: /bin/bash process/02-discover/validate-discovery.sh

      - name: Validate every define cycle
        # Accounting, method, outlier section. The accounting check caught a real
        # defect by hand before it was mechanised; this is so the next one is
        # caught here instead of by someone reading carefully.
        run: /bin/bash process/03-define/validate-define.sh

      - name: Validate every decision record
        # A decision is made by a human and the record names which one. This
        # guards the only thing here that cannot be reconstructed afterwards.
        run: /bin/bash process/05-deliver/validate-decision.sh

      - name: Prove the suite can fail
        # A runner that swallows a failure makes every suite vacuous while
        # reporting green. Assert the failure path rather than trusting it.
        run: |
          if /bin/bash tests/run-all.sh tests/fixtures/runner/failing >/dev/null 2>&1; then
            echo "run-all.sh reported success on a deliberately failing suite" >&2
            exit 1
          fi
          echo "ok — the runner fails when a suite fails"

  commit-messages:
    # The commit-msg hook is bypassable. This is the same check, server-side.
    #
    # It used to be gated on `github.event_name == 'pull_request'`, so a direct
    # push to main skipped it entirely — while AGENTS.md said CI "runs the same
    # checks where they cannot be skipped". Found by the external audit in #22.
    # It now runs on a push too, over the commits that push adds.
    #
    # Two commits on main predate the convention: `6142a91 Initial commit` and
    # `fa7538a Baseline the 0.0.0 prototype`. Neither falls in any push range,
    # so neither has ever been checked and neither can be without rewriting
    # history — issue #51's territory, not this job's.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check conventional subjects and refuse attribution
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -u
          fail=0

          # The range differs by event. On a pull request it is base..head; on a
          # push it is the commits that push added.
          if [ -n "${PR_HEAD:-}" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
            # A new branch or a force-push reports an all-zero `before`, and
            # there is no range to check. Say so rather than silently pass or
            # walk the whole history.
            case "$BASE" in
              ''|0000000000000000000000000000000000000000)
                echo "no push range (before is empty or zero) — nothing to check"
                exit 0 ;;
            esac
          fi
          echo "checking $BASE..$HEAD"
          # --no-merges: a merge commit's subject is generated by the forge, not
          # authored, so holding it to the convention blocks every branch that
          # has main merged into it.
          for c in $(git rev-list --no-merges "$BASE".."$HEAD"); do
            subject="$(git log -1 --format=%s "$c")"
            if ! printf '%s' "$subject" \
              | grep -Eq '^(feat|fix|docs|refactor|test|chore)(\([a-z0-9._/-]+\))?!?: .+'; then
              echo "::error::${c:0:7} is not a conventional commit — $subject"
              fail=1
            fi
            if [ "${#subject}" -gt 72 ]; then
              echo "::error::${c:0:7} subject is ${#subject} characters, limit is 72"
              fail=1
            fi
            if git log -1 --format=%B "$c" \
              | grep -Eiq '^[[:space:]]*co-authored-by:|generated with|🤖|noreply@anthropic\.com'; then
              echo "::error::${c:0:7} carries an attribution trailer (AGENTS.md § Commits)"
              fail=1
            fi
          done
          exit "$fail"

  claims:
    # AGENTS.md forbids any claim about speed. That was a prose promise with
    # nothing behind it; this is the check.
    #
    # Scope: everything WE write. The record of what other people said is
    # excluded, because two of this repo's own rules collide there — AGENTS.md
    # forbids speed claims in documents, while the scan and discovery contracts
    # *require* recording a vendor's claim as a claim. A findings row reading
    # `TypeSafe states "193.6x Faster"` is the repository doing its job, not the
    # repository claiming speed.
    #
    # The exclusion is by directory rather than by phrasing on purpose. A lexical
    # rule that tried to tell "we claim X" from "they claim X" would be guessing
    # at attribution; the directory boundary is one that already exists in the
    # design. Those files carry their own constraint instead: every row needs a
    # resolving source, so an unattributed claim cannot live there anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse speed and velocity claims
        # The pattern lives in bin/validate-claims.sh, not here. Inline it was
        # unrunnable locally and untestable, and an external audit wrote a
        # document with six speed claims that it matched none of.
        run: /bin/bash bin/validate-claims.sh
