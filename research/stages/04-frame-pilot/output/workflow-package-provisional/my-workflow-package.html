<script>

  html+=section('value','04','Where the value is','A hypothesis grounded in your work. Unknowns stay unknown until you measure them.',`<div class="two"><div>${label('Your initial guess','value.initialGuess')}${label('The hypothesis to test','value.hypothesis')}${label('Why the evidence points here','value.why')}</div><div>${each('value.points',(v,p)=>`<div class="value-row"><h4>${field(p+'.name')}</h4><div><span class="chip">${field(p+'.evidenceStatus','No evidence yet')}</span>${field(p+'.evidence','Add the evidence or explain why it does not apply.')}</div></div>`)}</div></div><h3>The arithmetic, if the evidence supports it</h3><div class="sheet">${label('Formula','value.formula','Not yet calculable; establish the missing baseline first.')}${label('Result or scenario','value.calculation','No saving has been measured.')}${label('What could change this conclusion','value.caveat')}</div>${table('value.inputs',[['name','Input'],['value','Value'],['unit','Unit'],['period','Period'],['scope','Scope'],['basis','Basis'],['source','Source']])}<h3>Before you change anything</h3>${each('value.measures',(v,p)=>`<article class="block-row"><h4>${field(p+'.metric','Measure to collect')}</h4>${defs(p,[['baseline','Current baseline'],['method','How / source'],['owner','Who records it'],['period','Period'],['success','Success criterion']])}</article>`)}`);

  html+=section('barriers','06','What stands in the way','Each real obstacle needs a decision, a reason, and a next owner. Do not add barriers for completeness.',each('barriers',(b,p)=>`<article class="block-row"><h4>${field(p+'.name','Barrier to establish')}</h4>${field(p+'.detail')}<div class="proposal">${label('Proposed decision',p+'.decision')}${label('Why',p+'.why')}</div>${defs(p,[['dependency','Needed first'],['owner','Next owner']])}</article>`,'No barriers recorded. The audit should say whether none were identified or this area was not explored.'));
  html+=section('workspace','07','Your workspace','A structure shaped around your work, with readable instructions and a human check at the right point.',`<div class="two"><div class="sheet">${label('Recommended form','workspace.form','The repeating unit determines the form.')}${label('Unit of work','workspace.repeatUnit')}${label('Why this is enough','workspace.reason')}</div><div>${label('Capabilities needed, and what is unverified','workspace.capabilities','Tool access has not been established.')}</div></div><h3>The folder and file map</h3>${table('workspace.tree',[['path','Path from workspace root'],['role','Role'],['purpose','Job / contents'],['status','Supplied / proposed / owner needed']])}<h3>Instructions inside the folders</h3><p class="small">All paths are relative to the proposed workspace root. Open a document to read or copy its full instructions.</p>${each('workspace.documents',(doc,p)=>`<details class="document"><summary>${field(p+'.path','Instruction file path')}</summary><div class="code-sheet"><div class="code-head"><strong>Full Markdown contents</strong><button class="copy" data-copy="${p}.body">Copy instructions</button></div><pre>${field(p+'.body','The builder supplies the complete router or contract here.')}</pre></div></details>`,'A saved prompt can be sufficient; no folder contracts supplied.')}<h3>Prompts you can use</h3>${each('workspace.prompts',(doc,p)=>`<article class="document"><h4>${field(p+'.name','Prompt name')}</h4><p class="small">${field(p+'.when','When to use it')}</p><div class="code-sheet"><div class="code-head"><strong>Copy into your AI</strong><button class="copy" data-copy="${p}.text">Copy prompt</button></div><pre>${field(p+'.text','The builder supplies a complete prompt naming inputs, output, checks, and the NOT FOUND rule.')}</pre></div></article>`)}<h3>The desk in five lines</h3><div class="sheet">${defs('workspace.desk',[['files','Files'],['instruction','Instruction'],['check','Check'],['distrust','Do not trust yet'],['handoff','Someone else can run?']])}</div>`);
  html+=section('build','08','Build and test','One completed case, an answer you can check, and a clear reason to continue or stop.',`<div class="call"><span class="label">The first slice</span><h3>${field('build.slice','The smallest useful thing to try')}</h3>${defs('build',[['why','Why start here'],['done','Done looks like']])}</div><h3>Prepare these first</h3>${table('build.prepare',[['item','Item'],['detail','What to provide'],['owner','Who']])}<h3>The tests</h3>${each('build.tests',(t,p,i)=>`<article class="block-row"><div class="step-heading"><span class="chip">${String(i+1).padStart(2,'0')}</span><h4>${field(p+'.name','Test name')}</h4></div>${defs(p,[['input','Give it'],['expected','Expect'],['manualCheck','Check by hand'],['passRule','Pass / fail'],['status','Result / not run']])}</article>`)}<h3>What only you can describe</h3><div class="sheet">${field('build.onlyYou','Rules, definitions, exceptions, and examples that still need your account.')}</div><h3>The next few moves</h3>${table('build.next',[['when','When'],['action','Action']])}`);
  html+=section('questions','09','Open questions','These answers improve the plan. Use Edit package, type your corrections, then download your copy.',each('questions',(q,p)=>`<article class="question"><h4>${field(p+'.question','The next question that matters')}</h4>${defs(p,[['why','Why it matters'],['blocks','What it blocks'],['owner','Who can answer']])}<div class="answer">${label('Your answer',p+'.answer','Write your answer here after choosing Edit package.')}</div></article>`,'No open questions recorded. Check the assumptions before calling the package complete.'));
  html+=section('evidence','10','Evidence and assumptions','Your own account is the source. Proposals, contradictions, and missing information should be easy to spot.',`<div class="two"><div><h3 style="margin-top:0">In your words</h3>${each('evidence.quotes',(q,p)=>`<figure class="quote"><blockquote>${field(p+'.text','A verbatim excerpt from your own answer belongs here.')}</blockquote><figcaption class="small">${field(p+'.source','Source / evidence ID')}</figcaption></figure>`,'No verbatim excerpts used.')}</div><div class="sheet">${label('Confidence in the account','evidence.confidence','Not assessed')}${label('Reason and limits','evidence.reason','The builder explains the strength and limits of the evidence.')}</div></div><h3>Assumptions to confirm</h3>${each('evidence.assumptions',(a,p)=>`<article class="block-row">${label('Assumption',p+'.claim')}${defs(p,[['why','Why it matters'],['resolve','How to resolve']])}</article>`,'No assumptions recorded. This is not a substitute for checking the sources.')}<h3>Contradictions or corrections</h3>${each('evidence.conflicts',(a,p)=>`<article class="block-row">${label('Issue',p+'.issue')}${defs(p,[['sources','Sources in tension'],['resolution','Resolution / still open']])}</article>`,'No contradictions recorded.')}<h3>Sources used</h3>${table('evidence.sources',[['id','ID'],['label','Source'],['locator','Exact location'],['kind','Reported / inspected / other']])}`);
  html+=`<footer class="footer"><p>Make this yours: correct the account, download your copy, and test one small piece against work you can check.</p><p>Community workflow kit · Based on <a href="https://github.com/RinDig/icm-architect">ICM architect</a> by Jake Van Clief. This file contains no remote fonts, trackers, or external scripts.</p></footer>`;
  $('main').innerHTML=html;
  if(editing)enableEditing();
}
function notify(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',4200);}
function syncData(){dataEl.textContent=JSON.stringify(D,null,2).replace(/</g,'\\u003c');}
function enableEditing(){document.querySelectorAll('[data-path]').forEach(el=>{el.contentEditable='true';el.spellcheck=true;el.setAttribute('role','textbox');el.setAttribute('aria-label',el.dataset.path);el.setAttribute('aria-multiline','true');});}
function changeStatus(){dirty=true;$('save-status').textContent='Unsaved changes · download your HTML copy';syncData();}
$('main').addEventListener('focusin',event=>{const el=event.target.closest('[data-path]');if(editing&&el&&!get(el.dataset.path)){el.textContent='';el.classList.remove('empty');}});
$('main').addEventListener('input',event=>{const el=event.target.closest('[data-path]');if(!editing||!el)return;set(el.dataset.path,el.innerText.replace(/\r\n/g,'\n'));el.classList.toggle('empty',!get(el.dataset.path));changeStatus();});
$('main').addEventListener('focusout',event=>{const el=event.target.closest('[data-path]');if(editing&&el&&!get(el.dataset.path)){el.textContent=el.dataset.placeholder;el.classList.add('empty');}});
$('main').addEventListener('paste',event=>{if(!editing||!event.target.closest('[data-path]'))return;event.preventDefault();document.execCommand('insertText',false,event.clipboardData.getData('text/plain'));});
$('edit').onclick=()=>{editing=!editing;document.body.classList.toggle('editing',editing);$('edit').textContent=editing?'Finish editing':'Edit package';$('edit').setAttribute('aria-pressed',String(editing));render();if(editing)notify('Edit any outlined text. Download your copy to keep the changes.');};
$('main').addEventListener('click',async event=>{const button=event.target.closest('[data-copy]');if(!button)return;const value=get(button.dataset.copy);if(!value){notify('This instruction has not been filled in yet.');return;}try{await navigator.clipboard.writeText(value);notify('Copied.');}catch{const node=document.createElement('textarea');node.value=value;node.style.position='fixed';node.style.opacity='0';document.body.append(node);node.select();const ok=document.execCommand('copy');node.remove();notify(ok?'Copied.':'Copy unavailable. Select the text and copy it manually.');}});
function slug(){return (D.meta.title||'my-workflow-package').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,80)||'my-workflow-package';}
function download(content,type,name){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function htmlCopy(){syncData();const clone=document.documentElement.cloneNode(true);clone.querySelector('body').classList.remove('editing');clone.querySelector('#main').innerHTML='';clone.querySelector('#nav').innerHTML='';clone.querySelector('#toast').textContent='';clone.querySelector('#edit').textContent='Edit package';clone.querySelector('#edit').setAttribute('aria-pressed','false');clone.querySelector('#save-status').textContent='Saved copy · download again after editing';return '<!doctype html>\n'+clone.outerHTML;}
const headings={'meta':'Package details','overview':'01. Overview','steps':'02. Current workflow and proposed split','inputs':'03. Inputs','outputs':'Outputs','value':'04. Value and measurements','judgment':'05. Retained judgment','barriers':'06. Barriers and decisions','workspace':'07. Workspace and instructions','build':'08. First build and tests','questions':'09. Open questions','evidence':'10. Evidence and assumptions'};
const humanize=key=>key.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase());
function markdown(){const lines=['# '+(D.meta.title||'Your workflow package'),'','This copy contains the current package data, including your edits. Proposals are not implemented or tested unless their status explicitly records that.',''];function walk(value,key,depth){const heading='#'.repeat(Math.min(depth,6))+' '+(headings[key]||humanize(key));if(value&&typeof value==='object'){lines.push(heading,'');if(Array.isArray(value)){if(!value.length)lines.push('No entries supplied.','');value.forEach((v,i)=>walk(v,`Entry ${i+1}`,depth+1));}else Object.entries(value).forEach(([k,v])=>walk(v,k,depth+1));}else{lines.push('**'+humanize(key)+':**',String(value||'Not supplied'),'');}}Object.entries(D).filter(([key])=>key!=='version').forEach(([key,value])=>walk(value,key,2));return lines.join('\n');}
$('download-html').onclick=()=>{download(htmlCopy(),'text/html;charset=utf-8',slug()+'.html');dirty=false;$('save-status').textContent='HTML download requested · keep the downloaded file';notify('Your HTML copy is ready in downloads.');};
$('download-md').onclick=()=>{download(markdown(),'text/markdown;charset=utf-8',slug()+'.md');notify('Markdown download includes your current edits.');};
$('download-json').onclick=()=>{download(JSON.stringify(D,null,2),'application/json;charset=utf-8',slug()+'.json');notify('Data download includes your current edits.');};
let printOpen=[];
window.addEventListener('beforeprint',()=>{printOpen=[...document.querySelectorAll('details')].map(d=>[d,d.open]);printOpen.forEach(([d])=>d.open=true);});
window.addEventListener('afterprint',()=>printOpen.forEach(([d,open])=>d.open=open));
$('print').onclick=()=>window.print();
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
render();
if(D.meta.title&&$('save-status').textContent.startsWith('Blank template'))$('save-status').textContent='Working copy · download after making corrections';
window.addEventListener('scroll',()=>{let current='overview';for(const [id]of sections)if($(id).getBoundingClientRect().top<180)current=id;document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+current));},{passive:true});
</script>
</body>
</html>
